<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Pro</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}

header{
display:flex;justify-content:space-between;
padding:15px;background:#111;
position:sticky;top:0;
}

.logo{color:red;font-size:24px;font-weight:bold}

input{padding:8px;width:200px;border:none;border-radius:5px}

.tabs{text-align:center;padding:10px}
.tabs button{margin:5px;padding:8px;background:#222;color:#fff;border:none}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;padding:20px;
}

.card{background:#111;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%}
.card p{padding:5px;font-size:14px}

.modal{
display:none;position:fixed;
top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;align-items:center;flex-direction:column;
}

button{background:red;color:#fff;border:none;padding:8px}
</style>
</head>

<body>

<header>
<div class="logo">NETFLIX PRO</div>
<input id="search" placeholder="Search...">
</header>

<div class="tabs">
<button onclick="loadMovies()">Movies</button>
<button onclick="loadTV()">TV Shows</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div id="video"></div>
<button onclick="closeModal()">Close</button>
</div>

<script>

const BASE = "https://movieflix-v2-xi.vercel.app";

let allData = [];

  let page = 1;

async function loadMovies(){
  const res = await fetch(`${BASE}/api/movies?page=${page}`);
  const data = await res.json();

  allData = [...allData, ...data.results];
  render(allData);

  page++;
}

/* MOVIES */
async function loadMovies(){
const res = await fetch(`${BASE}/api/movies`);
const data = await res.json();

allData = data.results || [];
render(allData);
}

/* TV */
async function loadTV(){
const res = await fetch(`${BASE}/api/tv`);
const data = await res.json();

allData = data.results || [];
render(allData);
}

/* RENDER */
function render(list){
const grid = document.getElementById("grid");
grid.innerHTML = "";

list.forEach(item=>{
grid.innerHTML += `
<div class="card" onclick="openTrailer(${item.id})">
<img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
<p>${item.title || item.name}</p>
</div>
`;
});
}

/* TRAILER */
async function openTrailer(id){
const res = await fetch(`${BASE}/api/trailer?id=${id}`);
const data = await res.json();

const key = data.results?.[0]?.key;

if(!key) return alert("Trailer not found");

document.getElementById("video").innerHTML =
`<iframe width="90%" height="400"
src="https://www.youtube.com/embed/${key}" frameborder="0" allowfullscreen></iframe>`;

document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
document.getElementById("video").innerHTML="";
}

/* SEARCH */
document.getElementById("search").addEventListener("input",(e)=>{
const v = e.target.value.toLowerCase();
render(allData.filter(i=>(i.title||i.name).toLowerCase().includes(v)));
});

/* START */
loadMovies();

</script>

</body>
</html>
