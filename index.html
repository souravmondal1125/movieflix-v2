<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flixora</title>

<!-- 🔥 POPUNDER + SOCIAL BAR (SAFE - NO LAYOUT IMPACT) -->
<script src="https://pl29472266.effectivecpmnetwork.com/c9/1c/46/c91c464dee4b553b50a9a1b15c04505e.js"></script>
<script src="https://pl29477853.effectivecpmnetwork.com/9c/23/97/9c2397ced12f84d80e922389edf9b936.js"></script>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}

header{
display:flex;justify-content:space-between;
padding:15px;background:#111;
position:sticky;top:0;
}

.logo{color:red;font-size:24px;font-weight:bold}

input{padding:8px;width:200px;border:none;border-radius:5px}

.tabs{text-align:center;padding:10px}
.tabs button{margin:5px;padding:8px;background:#222;color:#fff;border:none;cursor:pointer}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;padding:20px;
}

.card{background:#111;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%}
.card p{padding:5px;font-size:14px}

.modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
flex-direction:column;
}

button{
background:red;
color:#fff;
border:none;
padding:8px;
cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<header>
<div class="logo">Flixora</div>
<input id="search" placeholder="Search...">
</header>

<!-- 🔥 (OPTIONAL SAFE BANNER AREA - NOT REQUIRED) -->
<!-- ads here won't break layout if you add later -->

<div class="tabs">
<button onclick="loadMovies()">Movies</button>
<button onclick="loadTV()">TV Shows</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div id="video"></div>
<button onclick="closeModal()">Close</button>
</div>

<script>

const BASE = "https://movieflix-v2-xi.vercel.app";

let page = 1;
let loading = false;
let allData = [];

/* LOAD MOVIES */
async function loadMovies(){

if(loading) return;
loading = true;

const res = await fetch(`${BASE}/api/movies?page=${page}`);
const data = await res.json();

allData = [...allData, ...data.results];

render(allData);

page++;
loading = false;
}

/* LOAD TV */
async function loadTV(){

const res = await fetch(`${BASE}/api/tv?page=1`);
const data = await res.json();

allData = data.results || [];

render(allData);
}

/* WATCH */
function openWatch(title){
const url = `https://www.youtube.com/results?search_query=${title}+full+movie`;
window.open(url, "_blank");
}

/* TRAILER */
async function openTrailer(id){

const res = await fetch(`${BASE}/api/trailer?id=${id}`);
const data = await res.json();

const key = data.results?.[0]?.key;

if(!key){
alert("Trailer not found");
return;
}

document.getElementById("video").innerHTML =
`<iframe width="90%" height="400"
src="https://www.youtube.com/embed/${key}"
frameborder="0" allowfullscreen></iframe>`;

document.getElementById("modal").style.display = "flex";
}

/* CLOSE */
function closeModal(){
document.getElementById("modal").style.display = "none";
document.getElementById("video").innerHTML = "";
}

/* RENDER */
function render(list){

const grid = document.getElementById("grid");
grid.innerHTML = "";

list.forEach(item=>{
grid.innerHTML += `
<div class="card">
<img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
<p>${item.title || item.name}</p>

<button onclick="openWatch('${item.title || item.name}')">
▶ Watch Now
</button>

</div>
`;
});
}

/* SEARCH */
document.getElementById("search").addEventListener("input",(e)=>{
const v = e.target.value.toLowerCase();
render(allData.filter(i=>(i.title||i.name).toLowerCase().includes(v)));
});

/* SCROLL */
window.addEventListener("scroll", ()=>{
if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 500){
loadMovies();
}
});

/* START */
loadMovies();

</script>

</body>
</html>
