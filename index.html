<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flixora</title>

<!-- ================= POPUNDER + SOCIAL BAR (HEAD) ================= -->
  <script src="https://pl29472266.effectivecpmnetwork.com/c9/1c/46/c91c464dee4b553b50a9a1b15c04505e.js"></script>
  <script src="https://pl29481773.effectivecpmnetwork.com/9a/f8/12/9af8120fe740a6c7f0db0f85e7a0ec86.js"></script>





<style>
*{margin:0;padding:0;box-sizing:border-box}

body{background:#000;color:#fff;font-family:Arial}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111;
position:sticky;
top:0;
z-index:999;
}

.logo{color:red;font-size:28px;font-weight:bold}

input{
padding:10px;
width:220px;
border:none;
border-radius:5px;
outline:none;
}

.tabs{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:15px;
background:#111;
}

.tabs button{
padding:10px 18px;
background:#222;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:20px;
padding:20px;
}

/* ================= BANNER AD SPACE ================= */
.ad-320{
display:flex;
justify-content:center;
margin:10px 0;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card p{
padding:10px;
font-weight:bold;
}

.card-buttons{
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

.card button{
background:red;
color:#fff;
border:none;
padding:8px;
cursor:pointer;
border-radius:5px;
}

.modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
flex-direction:column;
}

button{
background:red;
color:#fff;
border:none;
padding:8px;
cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<header>
<div class="logo">Flixora</div>
<input id="search" placeholder="Search...">
</header>

<!-- ================= 728x90 AD (HEADER BELOW) ================= -->
<div style="text-align:center;margin:10px 0;">
<script>
  atOptions = {
    'key' : '81b05da731e8cd931ace0c7d5d77fcf4',
    'format' : 'iframe',
    'height' : 90,
    'width' : 728,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/81b05da731e8cd931ace0c7d5d77fcf4/invoke.js"></script>

</div>

<div class="tabs">
<button onclick="loadMovies()">Trending</button>
<button onclick="loadTV()">TV Shows</button>
<button onclick="loadAnime()">Anime</button>
<button onclick="loadLanguage('en')">English</button>
<button onclick="loadLanguage('hi')">Hindi</button>
<button onclick="loadLanguage('ko')">Korean</button>
<button onclick="loadLanguage('ja')">Japanese</button>
<button onclick="loadLanguage('bn')">Bangla</button>
</div>

<!-- ================= 320x50 AD (BEFORE GRID) ================= -->
<div class="ad-320">
<script>
  atOptions = {
    'key' : '629ac74a8365d095d3b2e711824a684c',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/629ac74a8365d095d3b2e711824a684c/invoke.js"></script>

</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div id="video"></div>
<button onclick="closeModal()">Close</button>
</div>

<footer style="text-align:center;padding:20px;">
© 2026 Flixora
</footer>

<script>
const BASE = "https://movieflix-v2-xi.vercel.app";

let page = 1;
let loading = false;
let allData = [];

/* MOVIES */
async function loadMovies(){
if(loading) return;
loading = true;

const res = await fetch(`${BASE}/api/movies?page=${page}`);
const data = await res.json();

allData = [...allData, ...data.results];
render(allData);

page++;
loading = false;
}

/* TV */
async function loadTV(){
const res = await fetch(`${BASE}/api/tv?page=1`);
const data = await res.json();
allData = data.results || [];
render(allData);
}

/* ANIME */
async function loadAnime(){
const url = `https://api.themoviedb.org/3/discover/tv?api_key=9c8083df192467a734789e2838ce7bf1&with_genres=16`;
const res = await fetch(url);
const data = await res.json();
allData = data.results || [];
render(allData);
}

/* LANGUAGE */
async function loadLanguage(lang){
const url = `https://api.themoviedb.org/3/discover/movie?api_key=9c8083df192467a734789e2838ce7bf1&with_original_language=${lang}`;
const res = await fetch(url);
const data = await res.json();
allData = data.results || [];
render(allData);
}

/* WATCH */
function openWatch(title){
window.open(`https://www.youtube.com/results?search_query=${title}+full+movie`,"_blank");
}

/* TRAILER */
async function openTrailer(id){
const res = await fetch(`${BASE}/api/trailer?id=${id}`);
const data = await res.json();

const key = data.results?.[0]?.key;
if(!key){alert("Trailer not found");return;}

document.getElementById("video").innerHTML =
`<iframe width="100%" height="500"
src="https://www.youtube.com/embed/${key}"
frameborder="0" allowfullscreen></iframe>`;

document.getElementById("modal").style.display = "flex";
}

function closeModal(){
document.getElementById("modal").style.display = "none";
document.getElementById("video").innerHTML = "";
}

/* RENDER */
function render(list){
const grid = document.getElementById("grid");
grid.innerHTML = "";

list.forEach(item=>{
grid.innerHTML += `
<div class="card">
<img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
<p>${item.title || item.name}</p>
<button onclick="openWatch('${item.title || item.name}')">Watch</button>
<button onclick="openTrailer(${item.id})">Trailer</button>
</div>`;
});
}

/* SEARCH */
document.getElementById("search").addEventListener("input",(e)=>{
const v = e.target.value.toLowerCase();
render(allData.filter(i=>(i.title||i.name).toLowerCase().includes(v)));
});

/* START */
loadMovies();
</script>

</body>
</html>
