<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix Unlimited</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}

.hero{
height:60vh;
background-size:cover;
background-position:center;
display:flex;
align-items:flex-end;
padding:40px;
}

#hero-title{
font-size:35px;
background:rgba(0,0,0,0.5);
padding:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
}

.card img{width:100%}
.card p{padding:5px}
</style>
</head>

<body>

<div class="hero" id="hero">
<h1 id="hero-title"></h1>
</div>

<div class="grid" id="grid"></div>

<script>

const BASE = "https://movieflix-v2-xi.vercel.app";

let allData = [];
let page = 1;
let loading = false;

/* HERO */
function startHeroSlider(list){
  let i = 0;

  setInterval(()=>{
    const m = list[i];

    if(m?.backdrop_path){
      document.getElementById("hero").style.backgroundImage =
      `url(https://image.tmdb.org/t/p/original${m.backdrop_path})`;

      document.getElementById("hero-title").innerText =
      m.title || m.name;
    }

    i++;
    if(i >= list.length) i = 0;

  }, 4000);
}

/* LOAD MORE (UNLIMITED) */
async function loadMore(){
  if(loading) return;
  loading = true;

  const res = await fetch(`${BASE}/api/movies?page=${page}`);
  const data = await res.json();

  allData = [...allData, ...(data.results || [])];

  render(allData);

  if(page === 1){
    startHeroSlider(allData);
  }

  page++;
  loading = false;
}

/* RENDER */
function render(list){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  list.forEach(item=>{
    grid.innerHTML += `
      <div class="card">
        <img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
        <p>${item.title || item.name}</p>
      </div>
    `;
  });
}

/* INFINITE SCROLL */
window.addEventListener("scroll", ()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 500){
    loadMore();
  }
});

/* START */
loadMore();

</script>

</body>
</html>
