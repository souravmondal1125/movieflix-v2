<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}

header{
display:flex;justify-content:space-between;
padding:15px;background:#111;position:sticky;top:0;
}

.logo{color:red;font-size:24px;font-weight:bold}

input{padding:8px;width:200px;border-radius:5px;border:none}

.tabs{text-align:center;padding:10px}
.tabs button{margin:5px;padding:8px 15px;cursor:pointer}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;padding:20px;
}

.card{background:#111;border-radius:10px;cursor:pointer;overflow:hidden}
.card img{width:100%}
.card p{padding:5px;font-size:14px}

.modal{
display:none;position:fixed;top:0;left:0;
width:100%;height:100%;background:rgba(0,0,0,0.8);
justify-content:center;align-items:center;
}

.modal-box{
background:#111;padding:20px;border-radius:10px;max-width:400px;
}
button{background:red;color:#fff;border:none;padding:8px;cursor:pointer}
</style>
</head>

<body>

<header>
<div class="logo">MovieFlix</div>
<input id="search" placeholder="Search...">
</header>

<div class="tabs">
<button onclick="loadMovies()">Movies</button>
<button onclick="loadSeries()">TV Series</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div class="modal-box">
<h2 id="title"></h2>
<p id="desc"></p>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>

const BASE_URL = "https://movieflix-v2-xi.vercel.app";

const MOVIE_API = BASE_URL + "/api/movies?type=popular";
const TV_API = BASE_URL + "/api/tv?type=popular";

let allData = [];

async function loadMovies(){
const res = await fetch(MOVIE_API);
const data = await res.json();
allData = data.results || [];
render(allData);
}

async function loadSeries(){
const res = await fetch(TV_API);
const data = await res.json();
allData = data.results || [];
render(allData);
}

function render(list){
const grid = document.getElementById("grid");
grid.innerHTML = "";

list.forEach(item => {

const img = item.poster_path
? "https://image.tmdb.org/t/p/w500"+item.poster_path
: "https://via.placeholder.com/300";

grid.innerHTML += `
<div class="card" onclick="openModal('${item.title || item.name}','${item.overview || "No description"}')">
<img src="${img}">
<p>${item.title || item.name}</p>
</div>
`;
});
}

/* SEARCH */
document.getElementById("search").addEventListener("input",(e)=>{
const v = e.target.value.toLowerCase();
render(allData.filter(i => (i.title||i.name).toLowerCase().includes(v)));
});

/* MODAL */
function openModal(t,d){
document.getElementById("title").innerText=t;
document.getElementById("desc").innerText=d;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

loadMovies();

</script>

</body>
</html>
