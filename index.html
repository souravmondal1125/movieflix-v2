<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="MovieFlix - Watch Free Movies" />
    <meta property="og:description" content="Best collection of movies and web series." />
    <meta property="og:url" content="https://movieflix-v2-xi.vercel.app/" />
    <meta property="og:image" content="https://movieflix-v2-xi.vercel.app/images/banner.jpg" />

    <title>MovZone - Premium Global Streaming</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root{
            --bg-main:#0e1118;
            --bg-sidebar:#131722;
            --bg-card:#181f2a;
            --primary:#e50914;
            --text-main:#fff;
            --text-muted:#798296;
            --border:#222b3c;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            background:var(--bg-main);
            color:#fff;
            display:flex;
            min-height:100vh;
            overflow-x:hidden;
        }

        .sidebar{
            width:260px;
            background:var(--bg-sidebar);
            border-right:1px solid var(--border);
            position:fixed;
            top:0;
            left:0;
            bottom:0;
            overflow-y:auto;
            z-index:100;
        }

        .sidebar-brand{
            padding:25px;
            font-size:24px;
            font-weight:800;
            color:var(--primary);
            border-bottom:1px solid var(--border);
            cursor:pointer;
        }

        .sidebar-brand span{
            color:#fff;
        }

        .menu-heading{
            padding:20px 20px 10px;
            color:var(--text-muted);
            font-size:12px;
            text-transform:uppercase;
        }

        .menu-list{
            list-style:none;
            padding:0 10px;
        }

        .menu-item a{
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px;
            color:#b1b9ca;
            text-decoration:none;
            border-radius:8px;
            margin-bottom:5px;
            font-size:14px;
            font-weight:600;
        }

        .menu-item a:hover,
        .menu-item a.active{
            background:#1c2434;
            color:#fff;
        }

        .main-content{
            flex:1;
            margin-left:260px;
            padding:25px;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            margin-bottom:25px;
        }

        .search-wrapper{
            position:relative;
            width:100%;
            max-width:350px;
        }

        .search-wrapper i{
            position:absolute;
            left:15px;
            top:50%;
            transform:translateY(-50%);
            color:#777;
        }

        .search-wrapper input{
            width:100%;
            background:#161c28;
            border:1px solid var(--border);
            color:#fff;
            padding:12px 12px 12px 42px;
            border-radius:30px;
            outline:none;
        }

        .section-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .category-title{
            font-size:28px;
            font-weight:800;
        }

        .movie-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
            gap:20px;
        }

        .movie-card{
            background:var(--bg-card);
            border-radius:12px;
            overflow:hidden;
            border:1px solid var(--border);
            transition:.3s;
            cursor:pointer;
        }

        .movie-card:hover{
            transform:translateY(-6px);
        }

        .img-container{
            position:relative;
            height:250px;
            overflow:hidden;
        }

        .movie-card img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .card-badge{
            position:absolute;
            top:10px;
            left:10px;
            background:var(--primary);
            color:#fff;
            padding:4px 8px;
            border-radius:4px;
            font-size:10px;
            font-weight:700;
            z-index:2;
        }

        .quality{
            left:auto;
            right:10px;
            background:#2563eb;
        }

        .movie-info{
            padding:14px;
        }

        .movie-title{
            font-size:14px;
            font-weight:700;
            margin-bottom:10px;
            line-height:1.4;
        }

        .movie-meta{
            display:flex;
            justify-content:space-between;
            color:#aaa;
            font-size:12px;
        }

        .rating{
            color:#ffb400;
        }

        .load-more-container{
            text-align:center;
            margin:40px 0;
        }

        .load-more-btn{
            background:#131722;
            border:1px solid var(--border);
            color:#fff;
            padding:14px 35px;
            border-radius:30px;
            cursor:pointer;
            font-weight:700;
        }

        .load-more-btn:hover{
            background:var(--primary);
        }

        @media(max-width:1024px){

            .sidebar{
                display:none;
            }

            .main-content{
                margin-left:0;
            }

            .movie-grid{
                grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
            }

            .img-container{
                height:220px;
            }
        }

    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="sidebar-brand"
             onclick="loadTrending()">
            MOV<span>ZONE</span>
        </div>

        <div class="menu-heading">Discover</div>

        <ul class="menu-list">

            <li class="menu-item">
                <a href="#"
                   class="active"
                   onclick="loadTrending()">
                    <i class="fas fa-fire"></i>
                    Trending
                </a>
            </li>

            <li class="menu-item">
                <a href="#"
                   onclick="filterContent('movie','discover','Hindi Movies','hi')">
                    <i class="fas fa-film"></i>
                    Hindi
                </a>
            </li>

            <li class="menu-item">
                <a href="#"
                   onclick="filterContent('movie','discover','Bengali Movies','bn')">
                    <i class="fas fa-film"></i>
                    Bengali
                </a>
            </li>

            <li class="menu-item">
                <a href="#"
                   onclick="filterContent('movie','south','South Indian Movies')">
                    <i class="fas fa-bolt"></i>
                    South Indian
                </a>
            </li>

            <li class="menu-item">
                <a href="#"
                   onclick="filterContent('tv','discover','Korean Series','ko')">
                    <i class="fas fa-tv"></i>
                    K-Drama
                </a>
            </li>

        </ul>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div class="search-wrapper">

                <i class="fas fa-search"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search movies..."
                >

            </div>

        </header>

        <div class="section-header">

            <h2 class="category-title"
                id="pageTitle">
                Trending Now
            </h2>

        </div>

        <div class="movie-grid"
             id="main-movie-grid">
        </div>

        <div class="load-more-container">

            <button class="load-more-btn"
                    onclick="loadMore()">
                Load More
            </button>

        </div>

    </main>

<script>

    let currentPage = 1;

    let currentMode = 'movie';

    let currentType = 'trending';

    let currentLang = '';

    let isSouth = false;

    let excludeAnime = '';

    let searchQuery = '';

    function escapeHTML(str) {

        if (!str) return 'Unknown';

        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag]));
    }

    async function fetchMovies(isLoadMore = false) {

        const grid =
            document.getElementById('main-movie-grid');

        if (!isLoadMore) {

            grid.innerHTML =
                '<p style="padding:20px;color:#aaa;">Loading movies...</p>';

            currentPage = 1;
        }

        let target_url = '';

        // SEARCH
        if (searchQuery) {

            target_url =
                `/api/fetch?action=search&query=${encodeURIComponent(searchQuery)}&page=${currentPage}`;
        }

        // SOUTH
        else if (isSouth) {

            target_url =
                `/api/fetch?action=south&page=${currentPage}`;
        }

        // TRENDING
        else if (currentType === 'trending') {

            target_url =
                `/api/fetch?type=trending&mode=${currentMode}&page=${currentPage}`;
        }

        // DISCOVER
        else {

            target_url =
                `/api/fetch?mode=${currentMode}&page=${currentPage}`;
        }

        if (currentLang) {
            target_url += `&with_original_language=${currentLang}`;
        }

        if (excludeAnime === 'true') {
            target_url += `&exclude_anime=true`;
        }

        try {

            const response =
                await fetch(target_url);

            const data =
                await response.json();

            if (!isLoadMore) {
                grid.innerHTML = '';
            }

            if (!data.results || data.results.length === 0) {

                grid.innerHTML =
                    '<p style="padding:20px;color:#777;">No movies found.</p>';

                return;
            }

            data.results.forEach(item => {

                if (!item.poster_path) return;

                const title =
                    item.title || item.name || 'Unknown';

                const safeTitle =
                    escapeHTML(title);

                const rating =
                    item.vote_average
                    ? item.vote_average.toFixed(1)
                    : '7.0';

                const yearData =
                    (item.release_date ||
                    item.first_air_date ||
                    '2025').split('-')[0];

                let itemMode = currentMode;

                if (item.media_type) {
                    itemMode = item.media_type;
                }

                const watchLink =
                    `watch.html?id=${item.id}&mode=${itemMode}&title=${encodeURIComponent(title)}`;

                const card =
                    document.createElement('div');

                card.className = 'movie-card';

                card.innerHTML = `
                    <div class="img-container">

                        <span class="card-badge">
                            NEW
                        </span>

                        <span class="card-badge quality">
                            4K HD
                        </span>

                        <img
                            src="https://image.tmdb.org/t/p/w500${item.poster_path}"
                            alt="${safeTitle}"
                            loading="lazy"
                        >
                    </div>

                    <div class="movie-info">

                        <div class="movie-title">
                            ${safeTitle}
                        </div>

                        <div class="movie-meta">

                            <span>${yearData}</span>

                            <span class="rating">
                                ⭐ ${rating}
                            </span>

                        </div>
                    </div>
                `;

                card.onclick = () => {
                    window.location.href = watchLink;
                };

                grid.appendChild(card);
            });

        } catch (error) {

            console.log(error);

            grid.innerHTML = `
                <div style="padding:20px;color:red;">
                    Server Connection Failed
                </div>
            `;
        }
    }

    function loadTrending() {

        document.getElementById('pageTitle').innerText =
            'Trending Now';

        currentPage = 1;

        currentMode = 'movie';

        currentType = 'trending';

        currentLang = '';

        isSouth = false;

        searchQuery = '';

        fetchMovies(false);
    }

    function filterContent(mode, type, title, lang = '') {

        document.getElementById('pageTitle').innerText =
            title;

        currentMode = mode;

        currentType = type;

        currentLang = lang;

        searchQuery = '';

        isSouth = (type === 'south');

        currentPage = 1;

        fetchMovies(false);
    }

    function loadMore() {

        currentPage++;

        fetchMovies(true);
    }

    document.getElementById('searchInput')
        .addEventListener('input', (e) => {

        const q = e.target.value.trim();

        if (q.length > 2) {

            searchQuery = q;

            currentPage = 1;

            fetchMovies(false);

        } else if (q.length === 0) {

            loadTrending();
        }
    });

    window.addEventListener('DOMContentLoaded', () => {

        loadTrending();
    });

</script>

</body>
</html>
