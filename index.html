<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flixora</title>

<style>
/* ORIGINAL CSS (UNCHANGED) */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Arial;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111;
position:sticky;
top:0;
z-index:999;
}

.logo{
color:red;
font-size:28px;
font-weight:bold;
}

input{
padding:10px;
width:220px;
border:none;
border-radius:5px;
outline:none;
}

.tabs{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:15px;
background:#111;
}

.tabs button{
padding:10px 18px;
background:#222;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

.tabs button:hover{
background:red;
}

.hero{
height:60vh;
background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba') center/cover;
display:flex;
align-items:center;
padding:40px;
}

.hero h1{font-size:48px;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card p{
padding:10px;
font-weight:bold;
}

.card-buttons{
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

.card button{
background:red;
color:#fff;
border:none;
padding:8px;
cursor:pointer;
border-radius:5px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

.close-btn{
margin-top:20px;
padding:10px 20px;
background:red;
color:#fff;
border:none;
cursor:pointer;
}

/* 🆕 Continue Watching UI */
.continue-box{
background:#111;
margin:10px 20px;
padding:15px;
border-radius:10px;
}
</style>

</head>

<body>

<header>
<div class="logo">Flixora</div>
<input id="search" placeholder="Search movies...">
</header>

<!-- =========================
     🟢 MENU + GENRE ADDED
========================= -->
<div class="tabs">
<button onclick="loadMovies()">Trending</button>
<button onclick="loadTV()">TV Shows</button>
<button onclick="loadAnime()">Anime</button>

<button onclick="loadLanguage('en')">English</button>
<button onclick="loadLanguage('hi')">Hindi</button>
<button onclick="loadLanguage('ko')">Korean</button>
<button onclick="loadLanguage('ja')">Japanese</button>

<!-- GENRE FILTER -->
<button onclick="loadGenre(28)">Action</button>
<button onclick="loadGenre(35)">Comedy</button>
<button onclick="loadGenre(27)">Horror</button>
<button onclick="loadGenre(18)">Drama</button>
</div>

<section class="hero">
<div>
<h1>Unlimited Movies & TV Shows</h1>
<p>Watch trending movies, TV shows and anime</p>
</div>
</section>

<!-- CONTINUE WATCHING -->
<div id="continueBox"></div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div id="video"></div>
<button class="close-btn" onclick="closeModal()">Close</button>
</div>

<script>

const BASE = "https://movieflix-v2-xi.vercel.app";

let page = 1;
let loading = false;
let allData = [];

/* MOVIES */
async function loadMovies(){
if(loading) return;
loading = true;

const res = await fetch(`${BASE}/api/movies?page=${page}`);
const data = await res.json();

allData = [...allData, ...data.results];

render(allData);

page++;
loading = false;
}

/* TV */
async function loadTV(){
const res = await fetch(`${BASE}/api/tv?page=1`);
const data = await res.json();
allData = data.results || [];
render(allData);
}

/* ANIME */
async function loadAnime(){
const url = `https://api.themoviedb.org/3/discover/tv?api_key=9c8083df192467a734789e2838ce7bf1&with_genres=16`;
const res = await fetch(url);
const data = await res.json();
allData = data.results || [];
render(allData);
}

/* LANGUAGE */
async function loadLanguage(lang){
const url = `https://api.themoviedb.org/3/discover/movie?api_key=9c8083df192467a734789e2838ce7bf1&with_original_language=${lang}`;
const res = await fetch(url);
const data = await res.json();
allData = data.results || [];
render(allData);
}

/* 🟢 GENRE FILTER */
async function loadGenre(id){
const url = `https://api.themoviedb.org/3/discover/movie?api_key=9c8083df192467a734789e2838ce7bf1&with_genres=${id}`;
const res = await fetch(url);
const data = await res.json();
allData = data.results || [];
render(allData);
}

/* WATCH */
function openWatch(title){
const url = `https://www.youtube.com/results?search_query=${title}+full+movie`;
window.open(url, "_blank");
}

/* TRAILER */
async function openTrailer(id){

const res = await fetch(`${BASE}/api/trailer?id=${id}`);
const data = await res.json();

let trailer = data.results.find(v =>
v.type === "Trailer" && v.site === "YouTube"
);

if(!trailer){
trailer = data.results.find(v => v.site === "YouTube");
}

if(!trailer){
alert("Trailer not found");
return;
}

const key = trailer.key;

document.getElementById("video").innerHTML =
`<iframe width="100%" height="500"
src="https://www.youtube.com/embed/${key}?autoplay=1"
frameborder="0"
allow="autoplay; encrypted-media"
allowfullscreen></iframe>`;

document.getElementById("modal").style.display = "flex";
}

/* CLOSE */
function closeModal(){
document.getElementById("modal").style.display = "none";
document.getElementById("video").innerHTML = "";
}

/* 🟢 CONTINUE WATCHING */
function saveWatch(id,title){
localStorage.setItem("lastMovie", JSON.stringify({id,title}));
openWatch(title);
}

function loadContinue(){
const last = localStorage.getItem("lastMovie");
if(!last) return;

const movie = JSON.parse(last);

document.getElementById("continueBox").innerHTML = `
<div class="continue-box">
<h3>▶ Continue Watching</h3>
<p>${movie.title}</p>
<button onclick="openWatch('${movie.title}')">Resume</button>
</div>
`;
}

/* RENDER */
function render(list){
const grid = document.getElementById("grid");
grid.innerHTML = "";

list.forEach(item=>{
grid.innerHTML += `
<div class="card">
<img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
<p>${item.title || item.name}</p>

<div class="card-buttons">

<button onclick="saveWatch('${item.id}','${item.title || item.name}')">
▶ Watch
</button>

<button onclick="openTrailer(${item.id})">
🎬 Trailer
</button>

</div>
</div>
`;
});
}

/* SEARCH */
document.getElementById("search").addEventListener("input",(e)=>{
const value = e.target.value.toLowerCase();
render(allData.filter(i =>
(i.title || i.name).toLowerCase().includes(value)
));
});

/* SCROLL */
window.addEventListener("scroll", ()=>{
if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 500){
loadMovies();
}
});

/* START */
loadMovies();
loadContinue();

</script>

</body>
</html>
