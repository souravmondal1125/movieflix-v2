<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flixora</title>
   <script src="https://pl29477851.effectivecpmnetwork.com/61/ee/13/61ee1349e6f69a580ab9dcb0c5cbe3c1.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Arial;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111;
position:sticky;
top:0;
z-index:999;
}

.logo{
color:red;
font-size:28px;
font-weight:bold;
}

input{
padding:10px;
width:220px;
border:none;
border-radius:5px;
outline:none;
}

.tabs{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:15px;
background:#111;
}

.tabs button{
padding:10px 18px;
background:#222;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
transition:0.3s;
font-size:14px;
}

.tabs button:hover{
background:red;
transform:scale(1.05);
}

.hero{
height:60vh;
background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba') center/cover;
display:flex;
align-items:center;
padding:40px;
}

.hero-content{
max-width:500px;
}

.hero h1{
font-size:48px;
margin-bottom:15px;
}

.hero p{
line-height:1.6;
margin-bottom:20px;
}

.hero button{
padding:12px 22px;
background:red;
color:#fff;
border:none;
font-size:16px;
cursor:pointer;
border-radius:5px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
border-radius:10px;
overflow:hidden;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card p{
padding:10px;
font-size:15px;
font-weight:bold;
}

.card-buttons{
padding:10px;
display:flex;
flex-direction:column;
gap:8px;
}

.card button{
background:red;
color:#fff;
border:none;
padding:8px;
cursor:pointer;
border-radius:5px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#video{
width:90%;
max-width:900px;
}

.close-btn{
margin-top:20px;
padding:10px 20px;
background:red;
color:#fff;
border:none;
cursor:pointer;
}

footer{
background:#111;
padding:30px;
text-align:center;
margin-top:40px;
}

@media(max-width:768px){

header{
flex-direction:column;
gap:10px;
}

.hero h1{
font-size:32px;
}

input{
width:100%;
}

}
</style>

</head>

<body>

<header>
<div class="logo">Flixora</div>
<input id="search" placeholder="Search movies...">
</header>

<div class="tabs">
<button onclick="loadMovies()">Trending</button>
<button onclick="loadTV()">TV Shows</button>
<button onclick="loadAnime()">Anime</button>
<button onclick="loadLanguage('en')">English</button>
<button onclick="loadLanguage('hi')">Hindi</button>
<button onclick="loadLanguage('ko')">Korean</button>
<button onclick="loadLanguage('ja')">Japanese</button>
<button onclick="loadLanguage('bn')">Bangla</button>
</div>

<section class="hero">
<div class="hero-content">
<h1>Unlimited Movies & TV Shows</h1>
<p>
Watch trending movies, TV shows and anime from around the world.
</p>
<button onclick="window.scrollTo(0,700)">
Explore Now
</button>
</div>
</section>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div id="video"></div>
<button class="close-btn" onclick="closeModal()">
Close
</button>
</div>

<footer>
© 2026 Flixora — All Rights Reserved
</footer>

<script>

const BASE = "https://movieflix-v2-xi.vercel.app";

let page = 1;
let loading = false;
let allData = [];

/* =========================
   🟢 LOAD MOVIES
========================= */

async function loadMovies(){

  if(loading) return;

  loading = true;

  const res = await fetch(`${BASE}/api/movies?page=${page}`);

  const data = await res.json();

  allData = [...allData, ...data.results];

  render(allData);

  page++;

  loading = false;
}

/* =========================
   🟢 LOAD TV SHOWS
========================= */

async function loadTV(){

  const res = await fetch(`${BASE}/api/tv?page=1`);

  const data = await res.json();

  allData = data.results || [];

  render(allData);
}

/* =========================
   🟢 ANIME
========================= */

async function loadAnime(){

  const url =
  `https://api.themoviedb.org/3/discover/tv?api_key=9c8083df192467a734789e2838ce7bf1&with_genres=16`;

  const res = await fetch(url);

  const data = await res.json();

  allData = data.results || [];

  render(allData);
}

/* =========================
   🟢 LANGUAGE FILTER
========================= */

async function loadLanguage(lang){

  const url =
  `https://api.themoviedb.org/3/discover/movie?api_key=9c8083df192467a734789e2838ce7bf1&with_original_language=${lang}`;

  const res = await fetch(url);

  const data = await res.json();

  allData = data.results || [];

  render(allData);
}

/* =========================
   🟢 WATCH NOW
========================= */

function openWatch(title){

  const url =
  `https://www.youtube.com/results?search_query=${title}+full+movie`;

  window.open(url, "_blank");
}

/* =========================
   🟢 TRAILER
========================= */

async function openTrailer(id){

  const res = await fetch(`${BASE}/api/trailer?id=${id}`);

  const data = await res.json();

  const key = data.results?.[0]?.key;

  if(!key){
    alert("Trailer not found");
    return;
  }

  document.getElementById("video").innerHTML =
  `<iframe width="100%" height="500"
  src="https://www.youtube.com/embed/${key}"
  frameborder="0"
  allowfullscreen></iframe>`;

  document.getElementById("modal").style.display = "flex";
}

/* =========================
   🟢 CLOSE MODAL
========================= */

function closeModal(){

  document.getElementById("modal").style.display = "none";

  document.getElementById("video").innerHTML = "";
}

/* =========================
   🟢 RENDER UI
========================= */

function render(list){

  const grid = document.getElementById("grid");

  grid.innerHTML = "";

  list.forEach(item=>{

    grid.innerHTML += `

    <div class="card">

      <img src="https://image.tmdb.org/t/p/w500${item.poster_path}">

      <p>${item.title || item.name}</p>

      <div class="card-buttons">

      <button onclick="openWatch('${item.title || item.name}')">
      ▶ Watch Now
      </button>

      <button onclick="openTrailer(${item.id})">
      🎬 Trailer
      </button>

      </div>

    </div>

    `;

  });
}

/* =========================
   🟢 LIVE SEARCH
========================= */

document.getElementById("search")
.addEventListener("input",(e)=>{

  const value = e.target.value.toLowerCase();

  render(
    allData.filter(i=>
      (i.title || i.name)
      .toLowerCase()
      .includes(value)
    )
  );

});

/* =========================
   🟢 INFINITE SCROLL
========================= */

window.addEventListener("scroll", ()=>{

  if(
    window.innerHeight + window.scrollY >=
    document.body.offsetHeight - 500
  ){
    loadMovies();
  }

});

/* =========================
   🟢 START WEBSITE
========================= */

loadMovies();

</script>

</body>
</html>
